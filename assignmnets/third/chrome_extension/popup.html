<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Market Helper</title>
  <style>
    :root { --bg:#fff; --fg:#1b1b1b; --muted:#667085; --ok:#127c36; --err:#c62828; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--fg); background: var(--bg); }
    .wrap { padding: 12px; width: 380px; }
    .tabs { display: flex; gap: 8px; }
    .tabs button { padding: 6px 10px; border: 1px solid var(--border); background:#f8fafc; border-radius: 8px; cursor: pointer; }
    .tabs button.active { background:#e8eef9; border-color:#c7d2fe; }
    .tab { display: none; margin-top: 12px; }
    .tab.active { display: block; }
    h2 { font-size: 14px; margin: 12px 0 8px; }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
    input, select { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    button.btn { padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; cursor:pointer; }
    button.btn.primary { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
    .status, .panel { border:1px dashed var(--border); border-radius:8px; padding:10px; margin-top:10px; white-space:pre-wrap; }
    .muted { color:var(--muted); }
    .ok { color:var(--ok); }
    .err { color:var(--err); }
    table { width:100%; border-collapse: collapse; margin-top:8px; font-size: 12px; }
    th, td { border:1px solid var(--border); padding:6px; text-align:left; }
    th { background:#f3f4f6; }
    h4 { margin: 14px 0 6px; font-size: 13px; }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tabs">
      <button class="active" data-tab="tab-config">Config</button>
      <button data-tab="tab-movers">Movers</button>
    </div>

    <!-- Config -->
    <section id="tab-config" class="tab active">
      <h2>Configuration</h2>
      <label>Symbols (comma-separated)</label>
      <input id="cfg_symbols" placeholder="GC=F,SI=F,AAPL,MSFT" />

      <div class="row">
        <div>
          <label>Send time (HH:MM)</label>
          <input id="cfg_sendtime" placeholder="08:30" />
        </div>
      </div>

      <h2>Email <small>(optional)</small></h2>
      <div class="row">
        <input id="cfg_sender" placeholder="sender@example.com" />
        <input id="cfg_recipient" placeholder="recipient@example.com" />
      </div>

      <div class="btns">
        <button id="btn_save_cfg" class="btn primary">Save Config</button>
        <button id="btn_send_now" class="btn">Send Now</button>
        <button id="btn_refresh_status" class="btn">Refresh Status</button>
      </div>

      <div id="status_box" class="status muted">No analysis yet.</div>
    </section>

    <!-- Movers -->
    <section id="tab-movers" class="tab">
      <h2>Market Movers</h2>
      <div class="row">
        <select id="mov_market" title="market">
          <option value="us" selected>US</option>
          <option value="in">India</option>
        </select>
        <select id="mov_period" title="period">
          <option value="daily" selected>daily</option>
          <option value="3mo">3mo</option>
          <option value="6mo">6mo</option>
        </select>
        <input id="mov_top" type="number" min="1" max="50" value="10" title="top"/>
      </div>
      <div class="btns">
        <button id="btn_run_movers" class="btn primary">Run Movers</button>
      </div>
      <div id="mov_out" class="panel muted">No results.</div>
    </section>
  </div>

  <script src="popup.js" defer></script>
</body>
</html>
